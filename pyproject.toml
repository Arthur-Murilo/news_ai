[project]
name = "news-ai"
version = "0.1.0"
description = "Workflow de newsletter de noticias com LangGraph, Tavily e Resend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.17",
    "langchain-google-genai>=4.2.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.1.10",
    "python-dotenv>=1.0.1",
    "resend>=2.30.1",
    "rich>=15.0.0",
    "tavily-python>=0.7.24",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
