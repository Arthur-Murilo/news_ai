[project]
name = "news-ai"
version = "0.1.0"
description = "Workflow de newsletter de noticias com LangGraph, Tavily e Resend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.9",
    "langchain-google-genai>=4.2.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.0",
    "python-dotenv>=1.0.1",
    "resend>=2.30.1",
    "rich>=15.0.0",
    "tavily-python>=0.7.24",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
